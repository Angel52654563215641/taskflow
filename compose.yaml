services:
  database:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-taskflow}
      POSTGRES_USER: ${DB_USER:-taskflow_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-taskflow_local_2026}
    volumes:
      - taskflow_data:/var/lib/postgresql/data
    networks: [taskflow_network]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${DB_USER:-taskflow_user} -d $${DB_NAME:-taskflow}"]
      interval: 10s
      timeout: 5s
      retries: 5
  application:
    build: .
    restart: unless-stopped
    environment:
      SERVER_PORT: 8080
      SPRING_DATASOURCE_URL: jdbc:postgresql://database:5432/${DB_NAME:-taskflow}
      SPRING_DATASOURCE_USERNAME: ${DB_USER:-taskflow_user}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-taskflow_local_2026}
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
    ports: ["8080:8080"]
    depends_on:
      database:
        condition: service_healthy
    networks: [taskflow_network]
volumes:
  taskflow_data:
networks:
  taskflow_network:
    driver: bridge